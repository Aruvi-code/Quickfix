{% extends 'base.html' %}
{% block title %}All Users - Admin{% endblock %}
{% block content %}
<h2>👥 All Users</h2>
<div class="table-wrap">
<table class="data-table">
    <tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th></tr>
    {% for u in users %}
    <tr>
        <td>{{ u.id }}</td><td>{{ u.name }}</td><td>{{ u.email }}</td>
        <td>{{ u.phone or '-' }}</td><td>{{ u.created_at }}</td>
    </tr>
    {% endfor %}
</table>
</div>
<a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary" style="margin-top:16px; display:inline-block;">← Back</a>
{% endblock %}
