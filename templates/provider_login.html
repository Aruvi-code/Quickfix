{% extends 'base.html' %}
{% block title %}Provider Login - QuickFix{% endblock %}
{% block content %}
<div class="form-card">
    <div class="form-header">
        <h2>🛠️ Provider Login</h2>
    </div>
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" placeholder="your@email.com" required>
        <label>Password</label>
        <input type="password" name="password" placeholder="Your password" required>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:20px;">Login</button>
    </form>
    <p style="text-align:center; margin-top:16px;">New provider? <a href="{{ url_for('provider_register') }}">Register here</a></p>
</div>
{% endblock %}
