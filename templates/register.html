{% extends 'base.html' %}
{% block title %}Register - QuickFix{% endblock %}
{% block content %}
<div class="form-card">
    <div class="form-header">
        <h2>👤 Create Account</h2>
        <p>Join QuickFix and book services easily</p>
    </div>
    <form method="POST">
        <label>Full Name *</label>
        <input type="text" name="name" placeholder="Your full name" required>
        <label>Email *</label>
        <input type="email" name="email" placeholder="your@email.com" required>
        <label>Phone</label>
        <input type="text" name="phone" placeholder="10-digit mobile number">
        <label>Password *</label>
        <input type="password" name="password" placeholder="Create a strong password" required>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:20px;">Register</button>
    </form>
    <p style="text-align:center; margin-top:16px;">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
</div>
{% endblock %}
